<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Transition curtain — Right evidence</title><desc id="desc">Brief transition between chapters or models. Loop duration 1.9 seconds. Animate in a modern browser. To use in PowerPoint/video, render frames or record a timed browser playback; SVG import may be static. Transparent source canvas; export alpha as WebM/ProRes 4444 when needed. Preserve animation duration and 1920x1080 aspect ratio. Original artwork, CC BY 4.0. Attribution: AI Update Sources.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061423"/><stop offset="1" stop-color="#0c273d"/></linearGradient><radialGradient id="soft"><stop stop-color="#53d5ec" stop-opacity=".13"/><stop offset="1" stop-color="#53d5ec" stop-opacity="0"/></radialGradient><radialGradient id="quiet"><stop stop-color="#061423" stop-opacity=".40"/><stop offset=".55" stop-color="#061423" stop-opacity=".25"/><stop offset="1" stop-color="#061423" stop-opacity="0"/></radialGradient><linearGradient id="ribbon"><stop stop-color="#53d5ec"/><stop offset=".6" stop-color="#eaf7ff"/><stop offset="1" stop-color="#e5bb69"/></linearGradient></defs><g ><animateTransform attributeName="transform" type="translate" values="0 0;2560 0" dur="1.9s" repeatCount="indefinite" /><rect x="-640.00" y="0.00" width="640.00" height="1080.00" rx="0" fill="#061423" stroke="#061423" stroke-width="0" opacity="0.94" /><line x1="-4.00" y1="0.00" x2="-4.00" y2="1080.00" stroke="#e5bb69" stroke-width="4" opacity="0.8" /></g></svg>
