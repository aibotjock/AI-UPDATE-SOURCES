<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Source-panel wipe — Lower detail</title><desc id="desc">Transition or reveal a source panel without fabricated content. Loop duration 3.0 seconds. Animate in a modern browser. To use in PowerPoint/video, render frames or record a timed browser playback; SVG import may be static. Transparent source canvas; export alpha as WebM/ProRes 4444 when needed. Preserve animation duration and 1920x1080 aspect ratio. Original artwork, CC BY 4.0. Attribution: AI Update Sources.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061423"/><stop offset="1" stop-color="#0c273d"/></linearGradient><radialGradient id="soft"><stop stop-color="#53d5ec" stop-opacity=".13"/><stop offset="1" stop-color="#53d5ec" stop-opacity="0"/></radialGradient><radialGradient id="quiet"><stop stop-color="#061423" stop-opacity=".40"/><stop offset=".55" stop-color="#061423" stop-opacity=".25"/><stop offset="1" stop-color="#061423" stop-opacity="0"/></radialGradient><linearGradient id="ribbon"><stop stop-color="#53d5ec"/><stop offset=".6" stop-color="#eaf7ff"/><stop offset="1" stop-color="#e5bb69"/></linearGradient></defs><g ><animate attributeName="opacity" values="0;1;1;0" dur="3.0s" repeatCount="indefinite" /><animateTransform attributeName="transform" type="translate" values="-850 0;0 0;0 0;850 0" dur="3.0s" repeatCount="indefinite" /><rect x="535.00" y="700.00" width="850.00" height="220.00" rx="10" fill="#53d5ec" stroke="#53d5ec" stroke-width="1" opacity="0.12" /></g><g ><animateTransform attributeName="transform" type="translate" values="0 0;850 0;850 0;0 0" dur="3.0s" repeatCount="indefinite" /><line x1="535.00" y1="700.00" x2="535.00" y2="920.00" stroke="#e5bb69" stroke-width="3" opacity="0.8" /></g></svg>
