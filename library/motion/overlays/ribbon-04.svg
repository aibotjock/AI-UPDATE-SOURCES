<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Evidence ribbon — Lower detail</title><desc id="desc">Animate a perimeter ribbon around cited content. Loop duration 5.1 seconds. Animate in a modern browser. To use in PowerPoint/video, render frames or record a timed browser playback; SVG import may be static. Transparent source canvas; export alpha as WebM/ProRes 4444 when needed. Preserve animation duration and 1920x1080 aspect ratio. Original artwork, CC BY 4.0. Attribution: AI Update Sources.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061423"/><stop offset="1" stop-color="#0c273d"/></linearGradient><radialGradient id="soft"><stop stop-color="#53d5ec" stop-opacity=".13"/><stop offset="1" stop-color="#53d5ec" stop-opacity="0"/></radialGradient><radialGradient id="quiet"><stop stop-color="#061423" stop-opacity=".40"/><stop offset=".55" stop-color="#061423" stop-opacity=".25"/><stop offset="1" stop-color="#061423" stop-opacity="0"/></radialGradient><linearGradient id="ribbon"><stop stop-color="#53d5ec"/><stop offset=".6" stop-color="#eaf7ff"/><stop offset="1" stop-color="#e5bb69"/></linearGradient></defs><path d="M 1830 0 C 1780 350 1900 650 1840 1080" fill="none" stroke="#53d5ec" stroke-width="1" opacity="0.35" /><path d="M 1830 0 C 1780 350 1900 650 1840 1080" fill="none" stroke="#e5bb69" stroke-width="3" opacity="0.7" stroke-dasharray="85 2400"/><circle r="5" fill="#eaf7ff"><animateMotion path="M 1830 0 C 1780 350 1900 650 1840 1080" dur="5.1s" repeatCount="indefinite"/></circle></svg>
