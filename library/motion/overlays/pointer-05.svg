<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Annotation path — Wide comparison</title><desc id="desc">Animated pointer path to support a factual callout. Loop duration 3.3 seconds. Animate in a modern browser. To use in PowerPoint/video, render frames or record a timed browser playback; SVG import may be static. Transparent source canvas; export alpha as WebM/ProRes 4444 when needed. Preserve animation duration and 1920x1080 aspect ratio. Original artwork, CC BY 4.0. Attribution: AI Update Sources.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061423"/><stop offset="1" stop-color="#0c273d"/></linearGradient><radialGradient id="soft"><stop stop-color="#53d5ec" stop-opacity=".13"/><stop offset="1" stop-color="#53d5ec" stop-opacity="0"/></radialGradient><radialGradient id="quiet"><stop stop-color="#061423" stop-opacity=".40"/><stop offset=".55" stop-color="#061423" stop-opacity=".25"/><stop offset="1" stop-color="#061423" stop-opacity="0"/></radialGradient><linearGradient id="ribbon"><stop stop-color="#53d5ec"/><stop offset=".6" stop-color="#eaf7ff"/><stop offset="1" stop-color="#e5bb69"/></linearGradient></defs><path d="M 640 690 Q 800 540 960 540" fill="none" stroke="#e5bb69" stroke-width="3" opacity="0.8" stroke-dasharray="420"/><g ><animate attributeName="opacity" values=".3;1;1;.3" dur="3.3s" repeatCount="indefinite" /><polygon points="944.00,530.00 960.00,540.00 941.00,546.00" stroke="#e5bb69" stroke-width="0" fill="#e5bb69" opacity="1"/></g><g ><animate attributeName="opacity" values="0;.8;0" dur="3.3s" repeatCount="indefinite" /><circle cx="960.00" cy="540.00" r="24.00" fill="none" stroke="#53d5ec" stroke-width="2" opacity="0.6" /></g></svg>
