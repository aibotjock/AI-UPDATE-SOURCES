<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="asset-title asset-description">
<title id="asset-title">Qualified recommendation</title>
<desc id="asset-description">Original editable template for verdict. All displayed results, models, costs, and evidence fields are placeholders requiring verification. Not a factual comparison.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63dcec"/></marker></defs>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#081421"/>
<line x1="70" y1="70" x2="1850" y2="70" stroke="#294456" stroke-width="2"/>
<text x="70" y="57" fill="#63dcec" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">AI UPDATE / VERDICT</text>
<text x="70" y="147" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="54" font-weight="700">Qualified recommendation</text>
<text x="73" y="194" fill="#abc0cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400">Recommendations must be bounded by tested task, observed evidence, access conditions, and date.</text>
<rect x="1555" y="23" width="295" height="42" rx="9" fill="#081421" stroke="#efc26d" stroke-width="1"/>
<text x="1569" y="51" fill="#efc26d" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700">TEMPLATE • VERIFY DATA</text>
<line x1="70" y1="1018" x2="1850" y2="1018" stroke="#294456" stroke-width="2"/>
<text x="70" y="1051" fill="#efc26d" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">TEMPLATE / no measured results embedded</text>
<text x="1270" y="1051" fill="#abc0cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">CC BY 4.0 • AI Update Sources</text>
<rect x="70" y="235" width="1120" height="415" rx="16" fill="#112637" stroke="#294456" stroke-width="1"/>
<rect x="70" y="235" width="6" height="415" rx="2" fill="#63dcec"/>
<text x="96" y="277" fill="#63dcec" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700">RECOMMENDATION / EXACT MODEL VERSION</text>
<text x="96" y="323" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="37" font-weight="400">Insert supported recommendation</text>
<text x="96" y="374.8" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="37" font-weight="400"></text>
<text x="96" y="426.6" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="37" font-weight="400">For this task and these conditions</text>
<rect x="1220" y="235" width="630" height="415" rx="16" fill="#112637" stroke="#294456" stroke-width="1"/>
<rect x="1220" y="235" width="6" height="415" rx="2" fill="#efc26d"/>
<text x="1246" y="277" fill="#efc26d" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700">VALUE RECORD</text>
<text x="1246" y="323" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="400">Measured task cost</text>
<text x="1246" y="362.2" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="400">Relevant benchmark</text>
<text x="1246" y="401.4" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="400">Observed task success</text>
<text x="1246" y="440.6" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="400">Checked date</text>
<rect x="70" y="685" width="1780" height="300" rx="16" fill="#112637" stroke="#294456" stroke-width="1"/>
<rect x="70" y="685" width="6" height="300" rx="2" fill="#efc26d"/>
<text x="96" y="727" fill="#efc26d" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700">WHY / LIMITATION</text>
<text x="96" y="773" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="400">State the decisive output evidence, the cheaper alternative, and the condition where this</text>
<text x="96" y="817.8" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="400">finding may not apply.</text>
