<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="asset-title asset-description">
<title id="asset-title">When to upgrade</title>
<desc id="asset-description">Original editable template for verdict. All displayed results, models, costs, and evidence fields are placeholders requiring verification. Not a factual comparison.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63dcec"/></marker></defs>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#081421"/>
<line x1="70" y1="70" x2="1850" y2="70" stroke="#294456" stroke-width="2"/>
<text x="70" y="57" fill="#63dcec" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">AI UPDATE / VERDICT</text>
<text x="70" y="147" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="54" font-weight="700">When to upgrade</text>
<text x="73" y="194" fill="#abc0cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400">Recommendations must be bounded by tested task, observed evidence, access conditions, and date.</text>
<rect x="1555" y="23" width="295" height="42" rx="9" fill="#081421" stroke="#efc26d" stroke-width="1"/>
<text x="1569" y="51" fill="#efc26d" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700">TEMPLATE • VERIFY DATA</text>
<line x1="70" y1="1018" x2="1850" y2="1018" stroke="#294456" stroke-width="2"/>
<text x="70" y="1051" fill="#efc26d" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">TEMPLATE / no measured results embedded</text>
<text x="1270" y="1051" fill="#abc0cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">CC BY 4.0 • AI Update Sources</text>
<rect x="660" y="235" width="600" height="180" rx="16" fill="#112637" stroke="#294456" stroke-width="1"/>
<rect x="660" y="235" width="6" height="180" rx="2" fill="#efc26d"/>
<text x="686" y="277" fill="#efc26d" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700">TASK REQUIREMENT</text>
<text x="686" y="323" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="400">Define the minimum acceptable</text>
<text x="686" y="366.4" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="400">result.</text>
<path d="M 960 415 L 960 465 M 500 465 L 1420 465 M 500 465 L 500 530 M 1420 465 L 1420 530" fill="none" stroke="#63dcec" stroke-width="3"/>
<rect x="70" y="530" width="860" height="290" rx="16" fill="#112637" stroke="#294456" stroke-width="1"/>
<rect x="70" y="530" width="6" height="290" rx="2" fill="#63dcec"/>
<text x="96" y="572" fill="#63dcec" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700">REQUIREMENT MET</text>
<text x="96" y="618" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="400">Choose the lowest-cost tested option that</text>
<text x="96" y="662.8" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="400">satisfies the requirement.</text>
<rect x="990" y="530" width="860" height="290" rx="16" fill="#112637" stroke="#294456" stroke-width="1"/>
<rect x="990" y="530" width="6" height="290" rx="2" fill="#efc26d"/>
<text x="1016" y="572" fill="#efc26d" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700">REQUIREMENT NOT MET</text>
<text x="1016" y="618" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400">Upgrade, change setup, or disclose that no</text>
<text x="1016" y="660.0" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400">tested option qualifies.</text>
<rect x="70" y="865" width="1780" height="58" rx="10" fill="#081421" stroke="#efc26d" stroke-width="1"/>
<text x="88" y="901" fill="#efc26d" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400">Record exact model, provider, task, test scope, cost basis, and the evidence supporting this path.</text>
</svg>