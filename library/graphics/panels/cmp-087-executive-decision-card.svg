<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="asset-title asset-description">
<title id="asset-title">Executive decision card</title>
<desc id="asset-description">Original editable template for verdict. All displayed results, models, costs, and evidence fields are placeholders requiring verification. Not a factual comparison.</desc>
