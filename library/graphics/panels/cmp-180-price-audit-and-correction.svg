<text x="96" y="837" fill="#efc26d" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700">CORRECTION RULE</text>
<text x="96" y="883" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400">Preserve prior values, document the change, and regenerate every affected output.</text>
