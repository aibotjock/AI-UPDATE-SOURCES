<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="asset-title asset-description">
<title id="asset-title">Price audit and correction</title>
<desc id="asset-description">Original editable template for cost explanation. All displayed results, models, costs, and evidence fields are placeholders requiring verification. Not a factual comparison.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63dcec"/></marker></defs>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#081421"/>
<line x1="70" y1="70" x2="1850" y2="70" stroke="#294456" stroke-width="2"/>
<text x="70" y="57" fill="#63dcec" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">AI UPDATE / COST EXPLANATION</text>
<text x="70" y="147" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="54" font-weight="700">Price audit and correction</text>
<text x="73" y="194" fill="#abc0cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400">Use official rates and observed billing; mark estimates explicitly and keep currencies and units visible.</text>
