<rect x="670" y="235" width="6" height="520" rx="2" fill="#efc26d"/>
<text x="696" y="277" fill="#efc26d" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700">CANONICAL CALCULATION</text>
<text x="696" y="323" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400">Saved actual usage ×</text>
<text x="696" y="365.0" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400">applicable rates</text>
