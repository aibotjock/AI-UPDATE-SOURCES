<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="asset-title asset-description">
<title id="asset-title">Overlapping uncertainty bands</title>
<desc id="asset-description">Original editable template for benchmark explainer. All displayed results, models, costs, and evidence fields are placeholders requiring verification. Not a factual comparison.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63dcec"/></marker></defs>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#081421"/>
<line x1="70" y1="70" x2="1850" y2="70" stroke="#294456" stroke-width="2"/>
<text x="70" y="57" fill="#63dcec" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">AI UPDATE / BENCHMARK EXPLAINER</text>
<text x="70" y="147" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="54" font-weight="700">Overlapping uncertainty bands</text>
<text x="73" y="194" fill="#abc0cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400">Schematic only: replace the bands with sourced estimates and uncertainty.</text>
<rect x="1555" y="23" width="295" height="42" rx="9" fill="#081421" stroke="#efc26d" stroke-width="1"/>
<text x="1569" y="51" fill="#efc26d" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700">TEMPLATE • VERIFY DATA</text>
<line x1="70" y1="1018" x2="1850" y2="1018" stroke="#294456" stroke-width="2"/>
<text x="70" y="1051" fill="#efc26d" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">TEMPLATE / no measured results embedded</text>
<text x="1270" y="1051" fill="#abc0cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">CC BY 4.0 • AI Update Sources</text>
<rect x="70" y="235" width="1780" height="180" rx="16" fill="#112637" stroke="#294456" stroke-width="1"/>
<rect x="70" y="235" width="6" height="180" rx="2" fill="#efc26d"/>
<text x="96" y="277" fill="#efc26d" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700">OBSERVED OVERLAP</text>
<text x="96" y="323" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="33" font-weight="400">Published or reproducibly calculated uncertainty may overlap; do not force a unique</text>
<text x="96" y="369.2" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="33" font-weight="400">winner.</text>
<rect x="70" y="450" width="1130" height="350" rx="16" fill="#112637" stroke="#294456" stroke-width="1"/>
<text x="100" y="499" fill="#63dcec" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700">SCHEMATIC / NO MEASURED VALUES</text>
<rect x="635" y="535" width="145" height="170" rx="4" fill="#081421" stroke="#294456" stroke-width="1"/>
<line x1="230" y1="570" x2="780" y2="570" stroke="#63dcec" stroke-width="9"/>
<circle cx="520" cy="570" r="13" fill="#f4f8fc"/>
<text x="100" y="574" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400">A</text>
<line x1="635" y1="665" x2="1080" y2="665" stroke="#efc26d" stroke-width="9"/>
<circle cx="850" cy="665" r="13" fill="#f4f8fc"/>
<text x="100" y="669" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400">B</text>
<text x="525" y="766" fill="#abc0cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400">Insert exact estimates, interval method, and sample.</text>
<rect x="1240" y="450" width="610" height="350" rx="16" fill="#112637" stroke="#294456" stroke-width="1"/>
<rect x="1240" y="450" width="6" height="350" rx="2" fill="#efc26d"/>
<text x="1266" y="492" fill="#efc26d" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700">CLAIM LIMIT</text>
<text x="1266" y="538" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400">No clear difference</text>
<text x="1266" y="574.4" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400">≠ proven equivalence</text>
<text x="1266" y="610.8" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400"></text>
<text x="1266" y="647.2" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400">Use a predeclared equivalence test</text>
<text x="1266" y="683.6" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400">if claiming equivalence.</text>
<rect x="70" y="852" width="1780" height="58" rx="10" fill="#081421" stroke="#efc26d" stroke-width="1"/>
<text x="88" y="888" fill="#efc26d" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400">Disclose interval type and estimator; interval overlap alone is not a complete hypothesis test.</text>
</svg>