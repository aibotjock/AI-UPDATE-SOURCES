<text x="696" y="323" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="400">Measured response</text>
<text x="696" y="370.6" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="400">completion</text>
