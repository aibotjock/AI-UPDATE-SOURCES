<text x="96" y="682" fill="#efc26d" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700">VIEWER DECISION</text>
<text x="96" y="728" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="400">Explain which tradeoff matters for this task. Use measured timing; label estimates</text>
<text x="96" y="775.6" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="400">and avoid unsupported productivity claims.</text>
