<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="asset-title asset-description">
<title id="asset-title">Episode correction card</title>
<desc id="asset-description">Original editable template for change report. All displayed results, models, costs, and evidence fields are placeholders requiring verification. Not a factual comparison.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63dcec"/></marker></defs>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#081421"/>
<line x1="70" y1="70" x2="1850" y2="70" stroke="#294456" stroke-width="2"/>
<text x="70" y="57" fill="#63dcec" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">AI UPDATE / CHANGE REPORT</text>
<text x="70" y="147" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="54" font-weight="700">Episode correction card</text>
<text x="73" y="194" fill="#abc0cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400">Only source-backed previous/current facts are permitted; distinguish availability from testing.</text>
<rect x="1555" y="23" width="295" height="42" rx="9" fill="#081421" stroke="#efc26d" stroke-width="1"/>
<text x="1569" y="51" fill="#efc26d" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700">TEMPLATE • VERIFY DATA</text>
<line x1="70" y1="1018" x2="1850" y2="1018" stroke="#294456" stroke-width="2"/>
<text x="70" y="1051" fill="#efc26d" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">TEMPLATE / no measured results embedded</text>
<text x="1270" y="1051" fill="#abc0cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">CC BY 4.0 • AI Update Sources</text>
<rect x="70" y="235" width="1780" height="180" rx="16" fill="#112637" stroke="#294456" stroke-width="1"/>
<rect x="70" y="235" width="6" height="180" rx="2" fill="#efc26d"/>
<text x="96" y="277" fill="#efc26d" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700">CORRECTION / EXACT REPLACEMENT STATEMENT</text>
<text x="96" y="323" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="400">State the corrected fact clearly before explaining the history.</text>
<rect x="70" y="455" width="875" height="370" rx="16" fill="#112637" stroke="#294456" stroke-width="1"/>
<rect x="70" y="455" width="6" height="370" rx="2" fill="#63dcec"/>
<text x="96" y="497" fill="#63dcec" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700">ORIGINAL RECORD</text>
<text x="96" y="543" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400">Episode / timestamp</text>
<text x="96" y="585.0" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400">Exact earlier statement</text>
<text x="96" y="627.0" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400">Supporting record</text>
<text x="96" y="669.0" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400">Reason it was wrong or stale</text>
<rect x="975" y="455" width="875" height="370" rx="16" fill="#112637" stroke="#294456" stroke-width="1"/>
<rect x="975" y="455" width="6" height="370" rx="2" fill="#efc26d"/>
<text x="1001" y="497" fill="#efc26d" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700">NEW EVIDENCE</text>
<text x="1001" y="543" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400">Current source and date</text>
<text x="1001" y="585.0" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400">Supported replacement</text>
<text x="1001" y="627.0" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400">Impacted recommendation</text>
<text x="1001" y="669.0" fill="#f4f8fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400">Updated index record</text>
<rect x="70" y="879" width="1780" height="58" rx="10" fill="#081421" stroke="#efc26d" stroke-width="1"/>
<text x="88" y="915" fill="#efc26d" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400">Preserve the earlier version and make the correction visible wherever the old claim is reused.</text>
<text x="70" y="1004" fill="#abc0cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400">CHECK: Original claim / Corrected claim / Impacted conclusions</text>
</svg>