<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="320" viewBox="0 0 1300 320"><title>Limited sample</title><desc>More representative tests are needed before making a broad recommendation.</desc><rect x="8" y="8" width="1284" height="304" rx="36" fill="#10273a" stroke="#294e65" stroke-width="3"/><g transform="translate(15,35)" fill="none" stroke="#63dcec" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle cx="72" cy="84" r="10"/><circle cx="115" cy="84" r="10"/><circle cx="158" cy="84" r="10"/><path d="M65 125h100M87 157h56"/></g><text x="260" y="118" fill="#f3f8fc" font-family="DejaVu Sans,sans-serif" font-size="43" font-weight="700">Limited sample</text><text x="260" y="179" fill="#efc26d" font-family="DejaVu Sans,sans-serif" font-size="19">EDITORIAL LABEL — APPLY ONLY WHEN ITS CONDITION IS VERIFIED</text><text x="260" y="229" fill="#c0d5e3" font-family="DejaVu Sans,sans-serif" font-size="21">More representative tests are needed before making a broad recommendation.</text></svg>