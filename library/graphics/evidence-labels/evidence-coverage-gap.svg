<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="320" viewBox="0 0 1300 320"><title>Model coverage gap</title><desc>Newer or untested models are absent; absence is not a failing score.</desc><rect x="8" y="8" width="1284" height="304" rx="36" fill="#10273a" stroke="#294e65" stroke-width="3"/><g transform="translate(15,35)" fill="none" stroke="#63dcec" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><rect x="49" y="52" width="124" height="103" rx="9"/><path d="M68 80h45M68 110h27M128 118v-17q0-17 14-17t15 15q0 13-13 16M143 139h1"/></g><text x="260" y="118" fill="#f3f8fc" font-family="DejaVu Sans,sans-serif" font-size="43" font-weight="700">Model coverage gap</text><text x="260" y="179" fill="#efc26d" font-family="DejaVu Sans,sans-serif" font-size="19">EDITORIAL LABEL — APPLY ONLY WHEN ITS CONDITION IS VERIFIED</text><text x="260" y="229" fill="#c0d5e3" font-family="DejaVu Sans,sans-serif" font-size="21">Newer or untested models are absent; absence is not a failing score.</text></svg>