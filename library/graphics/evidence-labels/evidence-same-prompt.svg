<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="320" viewBox="0 0 1300 320"><title>Identical prompt</title><desc>Inputs are shared; also disclose material settings and tool differences.</desc><rect x="8" y="8" width="1284" height="304" rx="36" fill="#10273a" stroke="#294e65" stroke-width="3"/><g transform="translate(15,35)" fill="none" stroke="#63dcec" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M65 80h100M65 130h100"/></g><text x="260" y="118" fill="#f3f8fc" font-family="DejaVu Sans,sans-serif" font-size="43" font-weight="700">Identical prompt</text><text x="260" y="179" fill="#efc26d" font-family="DejaVu Sans,sans-serif" font-size="19">EDITORIAL LABEL — APPLY ONLY WHEN ITS CONDITION IS VERIFIED</text><text x="260" y="229" fill="#c0d5e3" font-family="DejaVu Sans,sans-serif" font-size="21">Inputs are shared; also disclose material settings and tool differences.</text></svg>