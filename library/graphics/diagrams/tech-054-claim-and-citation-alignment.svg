<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Claim and citation alignment</title><desc id="desc">Verify the passage, source, and claim together. Do not cite a page only because it concerns the same broad topic.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#53D9E8"/></marker></defs><rect width="1920" height="1080" fill="#071424"/><circle cx="1800" cy="110" r="310" fill="#0C263B" opacity="0.5"/><path d="M 100 315 H 1820" stroke="#274359" stroke-width="2"/><text x="100.0" y="85.0" fill="#53D9E8" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">AI UPDATE SOURCES  /  EVERGREEN SCHEMATIC</text><text x="1820.0" y="85.0" fill="#AAC0D4" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="end">054 / 180</text><text x="100.0" y="167.0" fill="#F2F6FA" font-family="DejaVu Sans, Arial, sans-serif" font-size="49" font-weight="700" text-anchor="start">Claim and citation alignment</text><text x="100.0" y="229.0" fill="#AAC0D4" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Verify the passage, source, and claim together.</text><text x="100.0" y="285.0" fill="#F5C46B" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">SEARCH AND RESEARCH</text><path d="M 760,410 L 960,410 L 960,620 L 1198,620" fill="none" stroke="#53D9E8" stroke-width="4" marker-end="url(#arrow)"/><path d="M 760.0,620.0 L 1198.0,620.0" fill="none" stroke="#53D9E8" stroke-width="4" marker-end="url(#arrow)"/><path d="M 760,830 L 960,830 L 960,620 L 1198,620" fill="none" stroke="#53D9E8" stroke-width="4" marker-end="url(#arrow)"/><rect x="245" y="350" width="515" height="120" rx="22" fill="#102337" stroke="#53D9E8" stroke-width="2.5"/><rect x="263" y="370" width="5" height="80" rx="2" fill="#53D9E8"/><text x="502.5" y="418.0" fill="#F2F6FA" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Answer claim</text><rect x="245" y="560" width="515" height="120" rx="22" fill="#102337" stroke="#F5C46B" stroke-width="2.5"/><rect x="263" y="580" width="5" height="80" rx="2" fill="#F5C46B"/><text x="502.5" y="628.0" fill="#F2F6FA" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Supporting passage</text><rect x="245" y="770" width="515" height="120" rx="22" fill="#102337" stroke="#53D9E8" stroke-width="2.5"/><rect x="263" y="790" width="5" height="80" rx="2" fill="#53D9E8"/><text x="502.5" y="838.0" fill="#F2F6FA" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Source identity</text><rect x="1210" y="510" width="480" height="220" rx="22" fill="#102337" stroke="#F5C46B" stroke-width="2.5"/><rect x="1228" y="530" width="5" height="180" rx="2" fill="#F5C46B"/><text x="1450.0" y="628.0" fill="#F2F6FA" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Verified citation</text><path d="M 100 922 H 1820" stroke="#274359" stroke-width="2"/><text x="100.0" y="964.0" fill="#AAC0D4" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">Do not cite a page only because it concerns the same broad topic.</text><text x="100.0" y="1030.0" fill="#AAC0D4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Original explanatory graphic • Not measured benchmark evidence • CC BY 4.0</text><text x="1820.0" y="1030.0" fill="#AAC0D4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="end">Attribution: AI Update Sources</text></svg>