<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Benchmark saturation</title><desc id="desc">A test that barely separates models may be less useful for choosing. Assess discrimination with evidence rather than a fixed score threshold.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#53D9E8"/></marker></defs><rect width="1920" height="1080" fill="#071424"/><circle cx="1800" cy="110" r="310" fill="#0C263B" opacity="0.5"/><path d="M 100 315 H 1820" stroke="#274359" stroke-width="2"/><text x="100.0" y="85.0" fill="#53D9E8" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">AI UPDATE SOURCES  /  EVERGREEN SCHEMATIC</text><text x="1820.0" y="85.0" fill="#AAC0D4" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="end">139 / 180</text><text x="100.0" y="167.0" fill="#F2F6FA" font-family="DejaVu Sans, Arial, sans-serif" font-size="49" font-weight="700" text-anchor="start">Benchmark saturation</text><text x="100.0" y="229.0" fill="#AAC0D4" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">A test that barely separates models may be less useful for choosing.</text><text x="100.0" y="285.0" fill="#F5C46B" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">BENCHMARK LITERACY</text><path d="M 960.0,430.0 L 960.0,450.0" fill="none" stroke="#53D9E8" stroke-width="4" marker-end="url(#arrow)"/><rect x="270.0" y="330" width="1380" height="100" rx="22" fill="#102337" stroke="#53D9E8" stroke-width="2.5"/><rect x="288.0" y="350" width="5" height="60" rx="2" fill="#53D9E8"/><text x="960.0" y="388.0" fill="#F2F6FA" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Many tested models</text><path d="M 960.0,562.0 L 960.0,582.0" fill="none" stroke="#53D9E8" stroke-width="4" marker-end="url(#arrow)"/><rect x="420.0" y="462" width="1080" height="100" rx="22" fill="#102337" stroke="#F5C46B" stroke-width="2.5"/><rect x="438.0" y="482" width="5" height="60" rx="2" fill="#F5C46B"/><text x="960.0" y="520.0" fill="#F2F6FA" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Similar high scores</text><path d="M 960.0,694.0 L 960.0,714.0" fill="none" stroke="#53D9E8" stroke-width="4" marker-end="url(#arrow)"/><rect x="570.0" y="594" width="780" height="100" rx="22" fill="#102337" stroke="#53D9E8" stroke-width="2.5"/><rect x="588.0" y="614" width="5" height="60" rx="2" fill="#53D9E8"/><text x="960.0" y="652.0" fill="#F2F6FA" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Less separation</text><rect x="720.0" y="726" width="480" height="100" rx="22" fill="#102337" stroke="#F5C46B" stroke-width="2.5"/><rect x="738.0" y="746" width="5" height="60" rx="2" fill="#F5C46B"/><text x="960.0" y="784.0" fill="#F2F6FA" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Need complementary tasks</text><path d="M 100 922 H 1820" stroke="#274359" stroke-width="2"/><text x="100.0" y="964.0" fill="#AAC0D4" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">Assess discrimination with evidence rather than a fixed score threshold.</text><text x="100.0" y="1030.0" fill="#AAC0D4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Original explanatory graphic • Not measured benchmark evidence • CC BY 4.0</text><text x="1820.0" y="1030.0" fill="#AAC0D4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="end">Attribution: AI Update Sources</text></svg>