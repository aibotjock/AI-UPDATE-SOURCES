<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Prompt scope and effort</title><desc id="desc">Align instructions with the task rather than adding unrelated detail. Longer prompts are not automatically better prompts.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#53D9E8"/></marker></defs><rect width="1920" height="1080" fill="#071424"/><circle cx="1800" cy="110" r="310" fill="#0C263B" opacity="0.5"/><path d="M 100 315 H 1820" stroke="#274359" stroke-width="2"/><text x="100.0" y="85.0" fill="#53D9E8" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">AI UPDATE SOURCES  /  EVERGREEN SCHEMATIC</text><text x="1820.0" y="85.0" fill="#AAC0D4" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="end">018 / 180</text><text x="100.0" y="167.0" fill="#F2F6FA" font-family="DejaVu Sans, Arial, sans-serif" font-size="49" font-weight="700" text-anchor="start">Prompt scope and effort</text><text x="100.0" y="229.0" fill="#AAC0D4" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Align instructions with the task rather than adding unrelated detail.</text><text x="100.0" y="285.0" fill="#F5C46B" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">PROMPT AND INSTRUCTION DESIGN</text><path d="M 755.0,416.0 L 555.0,658.0" fill="none" stroke="#AAC0D4" stroke-width="4"/><path d="M 1165.0,416.0 L 1365.0,658.0" fill="none" stroke="#AAC0D4" stroke-width="4"/><path d="M 755.0,748.0 L 1165.0,748.0" fill="none" stroke="#AAC0D4" stroke-width="4"/><text x="960.0" y="617.0" fill="#AAC0D4" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">CONSIDER TOGETHER</text><rect x="710" y="335" w